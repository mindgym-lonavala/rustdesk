# Manashakti Support: Windows x64 custom client (portable EXE + MSI).
# Trimmed copy of the x64 job in flutter-build.yml plus branding steps; when
# merging upstream, re-sync the env versions and build steps from that file.
#
# Output is a workflow artifact only, not a public release: the client embeds
# the server address and key.
#
# Requires repository secret MANASHAKTI_CUSTOM_TXT: the signed custom.txt from
# branding/manashakti/make_custom_txt.py (app name, server address, server key).
name: Manashakti Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  APP_NAME: "ManashaktiSupport"
  MANUFACTURER: "Manashakti Research Centre"

jobs:
  check-config:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Verify signed custom.txt against the key compiled into the client
        env:
          CUSTOM_TXT: ${{ secrets.MANASHAKTI_CUSTOM_TXT }}
        run: |
          if [ -z "$CUSTOM_TXT" ]; then
            echo "::error::Repository secret MANASHAKTI_CUSTOM_TXT is not set"
            exit 1
          fi
          pip3 install -q cryptography
          printf '%s' "$CUSTOM_TXT" > custom.txt
          pub=$(sed -n 's/^    const KEY: &str = "\(.*\)";/\1/p' src/common.rs)
          python3 branding/manashakti/make_custom_txt.py verify custom.txt "$pub" > /dev/null
          python3 - <<'EOF'
          import base64, json, os
          cfg = json.loads(base64.b64decode(open("custom.txt").read().strip())[64:])
          assert cfg["app-name"] == os.environ["APP_NAME"], f"app-name {cfg['app-name']!r} != {os.environ['APP_NAME']!r}"
          print("custom.txt OK for", cfg["app-name"])
          EOF

  generate-bridge:
    needs: [check-config]
    uses: ./.github/workflows/bridge.yml

  build-RustDeskTempTopMostWindow:
    needs: [check-config]
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-windows:
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply Manashakti branding
        shell: bash
        # Windows runners check out with core.autocrlf=true; bash cannot run a CRLF script.
        run: |
          sed -i 's/\r$//' branding/manashakti/apply-branding.sh
          bash branding/manashakti/apply-branding.sh

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: topmostwindow-artifacts-x64
          path: "./rustdesk"

      - name: Add custom client config, app name and logos
        shell: bash
        env:
          CUSTOM_TXT: ${{ secrets.MANASHAKTI_CUSTOM_TXT }}
        run: |
          printf '%s' "$CUSTOM_TXT" > ./rustdesk/custom.txt
          mv ./rustdesk/rustdesk.exe "./rustdesk/$APP_NAME.exe"
          assets=./rustdesk/data/flutter_assets/assets
          mkdir -p "$assets"
          cp branding/manashakti/icon.ico branding/manashakti/icon.png \
             branding/manashakti/logo_light.png branding/manashakti/logo_dark.png "$assets/"
          ls -l ./rustdesk

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/$APP_NAME.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/$APP_NAME-$VERSION-x86_64.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build msi
        run: |
          pushd ./res/msi
          python preprocess.py --arp -c -d ../../rustdesk --app-name $env:APP_NAME -m "$env:MANUFACTURER"
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          mv $msi.FullName "../../SignOutput/$env:APP_NAME-$env:VERSION-x86_64.msi"
          popd
          Get-FileHash ./SignOutput/* -Algorithm SHA256 | Format-Table -AutoSize

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manashakti-support-windows-x86_64
          path: ./SignOutput
